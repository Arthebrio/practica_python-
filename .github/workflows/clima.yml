name: Reporte de clima diario

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  clima:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests huggingface_hub python-dotenv

      - run: python test.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
